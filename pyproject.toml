[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow"
version = "1.0.0"
description = "Observable energy data pipelines and carbon-aware infrastructure analytics"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
stream = ["kafka-python>=2.0,<3", "psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
signalflow = "signalflow.cli:main"

[tool.setuptools.package-data]
signalflow = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
