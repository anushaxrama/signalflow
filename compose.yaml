x-app: &app
  image: signalflow-app:local
  build: .
  environment: &env
    DATABASE_URL: postgresql+psycopg://signalflow:localdev@postgres:5432/signalflow
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalflow
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: signalflow
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U signalflow]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    ports: ['127.0.0.1:${SIGNALFLOW_PORT:-8000}:8000']
  worker:
    <<: *app
    command: [python, -m, signalflow.cli, worker, --days, '2']
    profiles: [polling]
    healthcheck: {disable: true}
  kafka-volume-init:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    user: '0:0'
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    entrypoint: [/bin/sh, -c]
    command: ['chown -R 1000:1000 /tmp/kraft-combined-logs']
  kafka:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/bash, -c]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic signalflow.grid.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic signalflow.deadletter.v1 --partitions 1 --replication-factor 1
  consumer:
    <<: *app
    profiles: [streaming]
    command: [python, -m, signalflow.cli, consume]
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  producer:
    <<: *app
    profiles: [streaming]
    entrypoint: [/bin/sh, -c]
    command: ['while true; do python -m signalflow.cli produce --days 2; sleep 300; done']
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    profiles: [orchestration]
    environment:
      <<: *env
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /home/airflow/project/orchestration
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      DBT_HOST: postgres
      DBT_PASSWORD: localdev
    ports: ['127.0.0.1:8080:8080']
    command: standalone
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [airflow-data:/opt/airflow]
volumes:
  postgres-data:
  kafka-data:
  airflow-data:
